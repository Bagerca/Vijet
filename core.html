<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>USO CORE (ЯДРО)</title>
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script>
        // Умный загрузчик для обхода кэша
        const v = new URLSearchParams(window.location.search).get('nocache') || Date.now();
        document.write(`<script src="js/config.js?v=${v}"><\/script>`);
        document.write(`<script src="js/event-bus.js?v=${v}"><\/script>`);
    </script>
</head>
<body>
    <div id="yt-player-core" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode');
        const cacheVersion = params.get('nocache') || Date.now();
        const scriptsToLoad = [];

        if (!mode) {
            scriptsToLoad.push(
                'js/services/avatar-manager.js', 'js/services/chat-filter.js',
                'js/core.js', 'js/audio-core.js', 'js/tts-core.js', 'js/queue-core.js', 'js/youtube-core.js'
            );
        } else {
            if (mode === 'master') {
                scriptsToLoad.push('js/services/avatar-manager.js', 'js/services/chat-filter.js', 'js/core.js', 'js/queue-core.js', 'js/youtube-core.js');
            }
            if (mode === 'tts') {
                scriptsToLoad.push('js/tts-core.js');
            }
            if (mode === 'alerts' || mode === 'deaths') {
                const originalListen = window.AppEvents.listen;
                window.AppEvents.listen = function(eventName, callback) {
                    if (eventName === 'PLAY_SOUND') {
                        originalListen.call(window.AppEvents, eventName, (d) => {
                            const isDeathSound = d.path.includes('death');
                            if (mode === 'deaths' && !isDeathSound) return;
                            if (mode === 'alerts' && isDeathSound) return;
                            callback(d);
                        });
                    } else {
                        originalListen.call(window.AppEvents, eventName, callback);
                    }
                };
                scriptsToLoad.push('js/audio-core.js');
            }
        }

        // Загружаем скрипты с обходом кэша
        scriptsToLoad.forEach(src => {
            const s = document.createElement('script');
            s.src = `${src}?v=${cacheVersion}`;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
