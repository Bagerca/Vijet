<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>USO CORE (ЯДРО)</title>
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <!-- Невидимый плеер Ядра -->
    <div id="yt-player-core" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></div>

    <script src="js/config.js"></script>
    <script src="js/event-bus.js"></script>

    <script>
        // УМНАЯ МАРШРУТИЗАЦИЯ ЯДРА (Разделение звука для OBS)
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode');
        const scriptsToLoad = [];

        if (!mode) {
            // Стандартный режим (всё вместе)
            scriptsToLoad.push('js/core.js', 'js/audio-core.js', 'js/tts-core.js', 'js/queue-core.js', 'js/youtube-core.js');
        } else {
            if (mode === 'master') {
                // Главное ядро: логика Twitch, музыкальный плеер
                scriptsToLoad.push('js/core.js', 'js/queue-core.js', 'js/youtube-core.js');
            }
            if (mode === 'tts') {
                // Только движок озвучки (TTS)
                scriptsToLoad.push('js/tts-core.js');
            }
            if (mode === 'alerts' || mode === 'deaths') {
                // Только звуки. Хитрый перехват, чтобы разделить смерти и алерты!
                const originalListen = window.AppEvents.listen;
                window.AppEvents.listen = function(eventName, callback) {
                    if (eventName === 'PLAY_SOUND') {
                        originalListen.call(window.AppEvents, eventName, (d) => {
                            const isDeathSound = d.path.includes('death');
                            if (mode === 'deaths' && !isDeathSound) return;
                            if (mode === 'alerts' && isDeathSound) return;
                            callback(d);
                        });
                    } else {
                        originalListen.call(window.AppEvents, eventName, callback);
                    }
                };
                scriptsToLoad.push('js/audio-core.js');
            }
        }

        // Динамически загружаем нужные скрипты
        scriptsToLoad.forEach(src => {
            const s = document.createElement('script');
            s.src = src;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
