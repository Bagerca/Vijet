<!-- ================= core.html ================= -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>USO CORE (ЯДРО)</title>
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script>
        const v = new URLSearchParams(window.location.search).get('nocache') || Date.now();
        document.write(`<script src="js/config.js?v=${v}"><\/script>`);
        document.write(`<script src="js/event-bus.js?v=${v}"><\/script>`);
    </script>
</head>
<body>
    <div id="yt-player-core" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const cacheVersion = params.get('nocache') || Date.now();
        
        const coreScripts = [
            'js/services/avatar-manager.js', 
            'js/services/chat-filter.js',
            'js/audio-core.js', 
            'js/tts-core.js', 
            'js/youtube-core.js', 
            'js/queue-core.js',
            // --- РАСЩЕПЛЕННОЕ ЯДРО ---
            'js/core/state.js',
            'js/core/commands.js',
            'js/core/chat.js',
            'js/core/controllers.js',
            'js/core/twitch.js',
            'js/core/main.js' 
        ];

        coreScripts.forEach(src => {
            const s = document.createElement('script');
            s.src = `${src}?v=${cacheVersion}`;
            s.async = false; 
            document.body.appendChild(s);
        });

        document.addEventListener("DOMContentLoaded", () => {
            console.log("%c[BOOTLOADER] Ожидание зависимостей...", "color: #FEE101; font-weight: bold;");
            
            const checkDependencies = setInterval(() => {
                // ИЗМЕНЕНО: Теперь ждем AppCoreMain
                if (window.ComfyJS && window.AppCoreMain && window.AppQueueCore && window.AvatarManager) {
                    clearInterval(checkDependencies);
                    console.log("%c[BOOTLOADER] Зависимости найдены. Запуск Ядра...", "color: #00FF7F; font-weight: bold;");
                    
                    const modules = [
                        window.AvatarManager,
                        window.AppAudioCore,
                        window.AppTTSCore,
                        window.AppPlayerCore,
                        window.AppQueueCore,
                        window.AppCoreMain
                    ];

                    modules.forEach(mod => {
                        if (mod && typeof mod.init === 'function' && !mod.isInitialized) {
                            try {
                                mod.init();
                                mod.isInitialized = true;
                            } catch (e) { console.error("[BOOTLOADER] Сбой инициализации:", e); }
                        }
                    });
                    
                    window.AppEvents.emit('CORE_READY');
                }
            }, 50); 
        });
    </script>
</body>
</html>
