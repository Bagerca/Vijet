<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WuWa Tacet Particles</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent; /* Полностью прозрачный фон */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        // Устанавливаем размер под стандартный монитор (OBS)
        canvas.width = 1920;
        canvas.height = 1080;

        let particlesArray = [];

        // Класс частицы
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5; // Мелкие искры
                this.speedX = Math.random() * 1 - 0.5; // Легкий снос вбок
                this.speedY = Math.random() * -1 - 0.2; // Медленно летят вверх
                
                // Цвета Wuthering Waves (80% бирюзовых, 20% золотых)
                const isGold = Math.random() > 0.8;
                this.color = isGold ? 'rgba(255, 215, 0, ' : 'rgba(0, 255, 204, ';
                
                this.opacity = Math.random() * 0.5 + 0.1; // Полупрозрачные
                this.life = Math.random() * 100 + 50; // Мерцание
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Если частица улетела вверх, возвращаем ее вниз
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }

                // Эффект мерцания (дыхания)
                this.life -= 1;
                if (this.life < 0) {
                    this.opacity = Math.random() * 0.5 + 0.1;
                    this.life = Math.random() * 100 + 50;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.opacity + ')';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color + '1)'; // Легкое свечение
                ctx.fill();
            }
        }

        // Создаем 70 частиц (чтобы не перегружать ПК, но было красиво)
        function init() {
            for (let i = 0; i < 70; i++) {
                particlesArray.push(new Particle());
            }
        }

        // Анимация
        function animate() {
            // Очищаем экран, но оставляем легкий след (хвосты частиц)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
