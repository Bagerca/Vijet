<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Stream Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- Задний фон: Частицы -->
    <canvas id="particles-canvas"></canvas>

    <div id="scene-wrapper">
        
        <!-- Динамический Goal-бар (Центр Верх) -->
        <div id="goal-container">
            <div id="goal-bar-bg">
                <div id="goal-bar-fill"></div>
            </div>
            <div id="goal-text">
                <span id="goal-title">⭐ Цель:</span>
                <span id="goal-count">0 / 0</span>
            </div>
        </div>

        <div id="alert-container" class="hidden"></div>
        <div id="shoutout-container" class="hidden"></div>
        <div id="social-rotator" class="fade-out"></div>

        <div id="chat-container">
            <div id="chat-messages"></div>
        </div>

        <div id="webcam-container">
            <video id="webcam-video" autoplay muted playsinline></video>
            <div id="webcam-frame"></div>
        </div>

        <div id="widget-container" class="hidden">
            <div id="player-wrapper">
                <div id="yt-player"></div>
                <div id="yt-progress-container">
                    <div id="yt-progress-bar"></div>
                </div>
            </div>
            <div id="info-bar">
                <div class="info-main">
                    <span class="icon">🎵</span>
                    <span id="requester-name">Никнейм</span>
                </div>
                <div class="info-stats">
                    <span title="Громкость">🔊 <span id="volume-level">30</span>%</span>
                    <span title="В очереди">⏳ <span id="queue-count">0</span></span>
                </div>
            </div>
        </div>

        <div id="ticker-container">
            <div id="ticker-text"></div>
        </div>

    </div>

    <!-- Модули логики (Строгий порядок загрузки) -->
    <script src="js/config.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/queue.js"></script>
    <script src="js/youtube.js"></script>
    <script src="js/mic.js"></script>
    <script src="js/socials.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/shoutout.js"></script>
    <script src="js/goal.js"></script>
    <script src="js/ticker.js"></script>
    <script src="js/twitch.js"></script>

    <!-- СИСТЕМА РАЗДЕЛЕНИЯ НА ВИДЖЕТЫ ДЛЯ OBS -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeWidget = urlParams.get('widget');

        if (activeWidget) {
            // 1. Блокируем "тяжелые" функции, если это не их виджет
            // Чтобы музыка Ютуба и микрофон камеры не запускались в каждом невидимом слое OBS
            if (activeWidget !== 'music' && window.AppPlayer) {
                window.AppPlayer.init = function() {}; 
            }
            if (activeWidget !== 'cam' && window.AppMedia) {
                window.AppMedia.init = function() {}; 
            }
            if (activeWidget !== 'particles' && window.AppParticles) {
                window.AppParticles.animate = function() {}; 
            }

            // 2. Словарь всех контейнеров на экране
            const widgetMap = {
                'chat': document.getElementById('chat-container'),
                'cam': document.getElementById('webcam-container'),
                'music': document.getElementById('widget-container'),
                'socials': document.getElementById('social-rotator'),
                'alerts': document.getElementById('alert-container'),
                'shoutout': document.getElementById('shoutout-container'),
                'goal': document.getElementById('goal-container'),
                'ticker': document.getElementById('ticker-container'),
                'particles': document.getElementById('particles-canvas')
            };

            // 3. Скрываем ненужное и ставим нужное в левый верхний угол
            for (const [key, element] of Object.entries(widgetMap)) {
                if (!element) continue;

                if (key === activeWidget) {
                    // --- НАСТРОЙКА АКТИВНОГО ВИДЖЕТА ---
                    if (key !== 'particles') {
                        // Сбрасываем CSS позиционирование (прижимаем в угол OBS)
                        element.style.position = 'absolute';
                        element.style.top = '0';
                        element.style.left = '0';
                        element.style.bottom = 'auto';
                        element.style.right = 'auto';
                        element.style.transform = 'none';
                        element.style.margin = '0';
                    }
                    
                    // Особые правки для удобства растягивания окна в OBS
                    if (key === 'chat') {
                        element.style.height = '100vh';
                        element.style.width = '100vw';
                        element.style.padding = '10px';
                        // Если хочешь убрать эффект исчезновения сверху чата, раскомментируй строку ниже:
                        // element.style.webkitMaskImage = 'none'; 
                    }
                    else if (key === 'music' || key === 'cam' || key === 'socials') {
                        element.style.width = '100vw';
                        element.style.height = '100vh';
                    }
                } else {
                    // --- СКРЫВАЕМ НЕАКТИВНЫЕ ВИДЖЕТЫ ---
                    element.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
