<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Stream Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div id="scene-wrapper">
        
        <!-- СЦЕНА: ОЖИДАНИЕ -->
        <div id="starting-container" style="display: none;">
            <div class="starting-glass-card">
                <div class="starting-status">
                    <div class="status-dot"></div>
                    ОЖИДАНИЕ ТРАНСЛЯЦИИ
                </div>
                <h1 class="starting-title">Ало,<br>Здравствуйте,<br>Добрый вечер</h1>
                <div class="starting-subtitle">Заваривайте чаёк, скоро начинаем ☕</div>
            </div>
        </div>

        <!-- СЦЕНА: ЗАВЕРШЕНИЕ -->
        <div id="ending-container" style="display: none;">
            <div class="ending-glass-card">
                <div class="ending-status">
                    <div class="status-dot-offline"></div>
                    ТРАНСЛЯЦИЯ ЗАВЕРШЕНА
                </div>
                <h1 class="ending-title">А всё,<br>а надо было раньше</h1>
                <div class="ending-subtitle">Спасибо всем, кто был сегодня на стриме 💜</div>
            </div>
        </div>

        <div id="goal-container">
            <div id="goal-bar-bg"><div id="goal-bar-fill"></div></div>
            <div id="goal-text">
                <span id="goal-title">⭐ Цель:</span>
                <span id="goal-count">0 / 0</span>
            </div>
        </div>

        <div id="alert-container" class="hidden"></div>
        <div id="shoutout-container" class="hidden"></div>
        <div id="social-rotator" class="fade-out"></div>
        
        <div id="deaths-container" class="hidden">
            <div class="deaths-title">DEATHS</div>
            <div id="deaths-count">0</div>
        </div>

        <!-- КОНТЕЙНЕР ДЛЯ ЛЕТЯЩИХ ЭМОДЗИ -->
        <div id="emotes-container"></div>

        <div id="chat-container">
            <div id="chat-messages"></div>
        </div>

        <!-- ВЕБ-КАМЕРА И ЛОГОТИП ИГРЫ -->
        <div id="webcam-container">
            <div id="game-logo-container" class="hidden">
                <img id="game-logo-img" src="" alt="Game Logo">
            </div>
            
            <!-- ПИКСЕЛЬНЫЙ ПИТОМЕЦ (ЛИСА) -->
            <div id="pet-container" class="state-idle">
                <div class="tail-wrapper">
                    <div class="fox-part tail-main"><div class="fox-part tail-tip"></div></div>
                </div>
                <div class="fox-part body">
                    <div class="fox-part chest"></div>
                    <div class="fox-part leg-front"></div>
                    <div class="fox-part leg-back"></div>
                </div>
                <div class="head-wrapper">
                    <div class="fox-part ear-l"><div class="ear-l-in"></div></div>
                    <div class="fox-part ear-r"><div class="ear-r-in"></div></div>
                    <div class="fox-part head-main">
                        <div class="fox-part cheek-l"></div>
                        <div class="fox-part cheek-r"></div>
                        <div class="fox-part snout">
                            <div class="fox-part nose"></div>
                            <div class="fox-part mouth"></div>
                        </div>
                        <div class="eye eye-l"></div>
                        <div class="eye eye-r"></div>
                    </div>
                </div>
            </div>

            <div id="webcam-frame"></div>
        </div>

        <!-- ПЛАШКА ОЗВУЧКИ (TTS) -->
        <div id="tts-container" class="hidden">
            <div class="tts-icon">🎙️</div>
            <div class="tts-info">
                <span class="tts-title">Озвучивает</span>
                <span id="tts-user" class="tts-user">Никнейм</span>
            </div>
            <div class="tts-wave">
                <div class="tts-bar"></div>
                <div class="tts-bar"></div>
                <div class="tts-bar"></div>
            </div>
        </div>

        <!-- МУЗЫКАЛЬНЫЙ ВИДЖЕТ -->
        <div id="widget-container" class="hidden">
            <div id="player-wrapper">
                <div id="yt-player"></div>
                <div id="yt-progress-container"><div id="yt-progress-bar"></div></div>
            </div>
            <div id="info-bar">
                <div class="info-main">
                    <span class="icon">🎵</span>
                    <span id="requester-name">Никнейм</span>
                </div>
                <div class="info-stats">
                    <span title="Громкость">🔊 <span id="volume-level">30</span>%</span>
                    <span title="В очереди">⏳ <span id="queue-count">0</span></span>
                </div>
            </div>
        </div>

        <div id="ticker-container"><div id="ticker-text"></div></div>

    </div>

    <!-- Модули логики -->
    <script src="js/config.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/emotes.js"></script>
    <script src="js/pet.js"></script> 
    <script src="js/chat.js"></script>
    <script src="js/queue.js"></script>
    <script src="js/youtube.js"></script>
    <script src="js/mic.js"></script>
    <script src="js/socials.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/shoutout.js"></script>
    <script src="js/goal.js"></script>
    <script src="js/ticker.js"></script>
    <script src="js/deaths.js"></script>
    <script src="js/gamelogo.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/twitch.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeWidget = urlParams.get('widget');
        const sceneParam = urlParams.get('scene');

        if (sceneParam === 'chatting') document.body.classList.add('scene-chatting');
        if (sceneParam === 'starting') document.body.classList.add('scene-starting');
        if (sceneParam === 'ending') document.body.classList.add('scene-ending'); 

        if (activeWidget) {
            document.body.style.setProperty('background', 'transparent', 'important');

            if (activeWidget !== 'music') {
                const ytPlayer = document.getElementById('yt-player');
                if (ytPlayer) ytPlayer.remove(); 
                if (window.AppPlayer) window.AppPlayer.play = function(){}; 
                if (window.AppQueue) window.AppQueue.add = function(){};    
            }

            if (activeWidget !== 'cam') {
                if (window.AppMedia) window.AppMedia.init = function(){}; 
            }

            if (activeWidget !== 'particles') {
                const canvas = document.getElementById('particles-canvas');
                if (canvas) canvas.remove();
                if (window.AppParticles) window.AppParticles.animate = function(){};
            }
            
            if (activeWidget !== 'emotes' && activeWidget !== 'chat') {
                if (window.AppEmotes) window.AppEmotes.spawn = function(){};
            }

            if (activeWidget !== 'tts') {
                if (window.AppTTS) window.AppTTS.add = function(){};
            }

            const widgets = {
                'chat': 'chat-container',
                'cam': 'webcam-container',
                'music': 'widget-container',
                'socials': 'social-rotator',
                'alerts': 'alert-container',
                'shoutout': 'shoutout-container',
                'goal': 'goal-container',
                'ticker': 'ticker-container',
                'deaths': 'deaths-container',
                'particles': 'particles-canvas',
                'emotes': 'emotes-container',
                'tts': 'tts-container',
                'starting': 'starting-container',
                'ending': 'ending-container',
                'pet': 'pet-container'
            };

            if (activeWidget === 'pet') {
                for (const [key, id] of Object.entries(widgets)) {
                    if (key !== 'cam' && key !== 'pet') {
                        const el = document.getElementById(id);
                        if (el) el.style.setProperty('display', 'none', 'important');
                    }
                }
                const frame = document.getElementById('webcam-frame');
                const logo = document.getElementById('game-logo-container');
                if(frame) frame.style.setProperty('display', 'none', 'important');
                if(logo) logo.style.setProperty('display', 'none', 'important');

            } else if (activeWidget === 'cam') {
                const pet = document.getElementById('pet-container');
                if(pet) pet.style.setProperty('display', 'none', 'important');
                
                for (const [key, id] of Object.entries(widgets)) {
                    if (key !== 'cam') {
                        const el = document.getElementById(id);
                        if (el) el.style.setProperty('display', 'none', 'important');
                    }
                }
            } else {
                for (const [key, id] of Object.entries(widgets)) {
                    if (key !== activeWidget) {
                        const el = document.getElementById(id);
                        if (el) {
                            el.style.setProperty('display', 'none', 'important');
                            if (key !== 'chat' && key !== 'emotes') el.innerHTML = ''; 
                        }
                    }
                }
            }
        }
        
        // ==============================================================
        // ОТКЛЮЧЕНИЕ МОДУЛЕЙ ДЛЯ МУЛЬТИ-СЦЕН (Starting / Ending)
        // ==============================================================

        // Отключение YouTube плеера
        if (urlParams.get('music') === 'off') {
            const ytPlayer = document.getElementById('yt-player');
            if (ytPlayer) ytPlayer.remove(); 
            const widgetContainer = document.getElementById('widget-container');
            if (widgetContainer) widgetContainer.remove();
            window.AppPlayer = { play: function(){}, hide: function(){}, setVolume: function(){} };
            window.AppQueue = { add: function(){}, next: function(){} };
        }

        // Отключение Голосовой Озвучки (TTS)
        if (urlParams.get('tts') === 'off') {
            if (window.AppTTS) window.AppTTS.add = function(){};
            const ttsContainer = document.getElementById('tts-container');
            if(ttsContainer) ttsContainer.remove();
        }

        // Отключение Алертов (Фолловы/Сабки), Смертей и Шаутаута
        if (urlParams.get('alerts') === 'off') {
            if (window.AppAlerts) window.AppAlerts.add = function(){};
            if (window.AppShoutout) window.AppShoutout.add = function(){};
            if (window.AppDeaths) window.AppDeaths.update = function(){};
            const alertContainer = document.getElementById('alert-container');
            if(alertContainer) alertContainer.remove();
        }

    </script>
</body>
</html>
